<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 40 440 370" width="100%" height="100%">
  <defs>
    <style>
      .blue-style {
        fill: none;
        stroke: #003366;
        stroke-width: 16;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .blue-head {
        fill: none;
        stroke: #003366;
        stroke-width: 14;
      }
      .text-style {
        font-family: 'Montserrat', 'Arial Black', 'Helvetica Neue', sans-serif;
        font-size: 58px;
        font-weight: 900;
        fill: #003366;
        letter-spacing: 2px;
      }
    </style>
  </defs>


  <g transform="translate(0, -10)">
    <!-- Central Table -->
    <!-- Table Top -->
    <line x1="300" y1="180" x2="500" y2="180" class="blue-style" />
    <!-- Table Leg -->
    <line x1="400" y1="180" x2="400" y2="285" class="blue-style" stroke-linecap="square" />
    <!-- Table Base -->
    <line x1="350" y1="285" x2="450" y2="285" class="blue-style" />

    <!-- Center Person -->
    <!-- Head -->
    <circle cx="400" cy="95" r="21" class="blue-head" />
    <!-- Body/Shoulders -->
    <path d="M 355 168 L 355 138 C 355 128, 365 120, 378 120 L 422 120 C 435 120, 445 128, 445 138 L 445 168" class="blue-style" stroke-linecap="square" />

    <!-- Left Person & Chair -->
    <!-- Head -->
    <circle cx="232" cy="108" r="21" class="blue-head" />
    <!-- Body & Chair Line -->
    <path d="M 233 155 L 253 205 L 320 205 L 320 288" class="blue-style" />
    <!-- Chair Outer Back -->
    <path d="M 205 160 L 225 240 L 293 240" class="blue-style" />

    <!-- Right Person & Chair -->
    <!-- Head -->
    <circle cx="568" cy="108" r="21" class="blue-head" />
    <!-- Body & Chair Line -->
    <path d="M 567 155 L 547 205 L 480 205 L 480 288" class="blue-style" />
    <!-- Chair Outer Back -->
    <path d="M 595 160 L 575 240 L 507 240" class="blue-style" />
  </g>

  <!-- Text -->
  <text x="400" y="380" text-anchor="middle" class="text-style">ENOMOS</text>
</svg>
